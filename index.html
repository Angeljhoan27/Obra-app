<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ObraControl 4x4 AI</title>
  
  <!-- Estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React y Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Librerías para PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .pattern-diagonal-lines {
      background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.1) 5px, rgba(0,0,0,0.1) 10px);
    }
    .pattern-grid {
      background-image: radial-gradient(rgba(0,0,0,0.2) 1px, transparent 1px);
      background-size: 10px 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICONOS INTEGRADOS (ZERO DEPENDENCY) ---
    // Solución robusta: Definimos los iconos SVG directamente para evitar errores de librerías externas UMD
    const IconWrapper = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );

    const Icons = {
      Camera: (p) => <IconWrapper {...p}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconWrapper>,
      DollarSign: (p) => <IconWrapper {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></IconWrapper>,
      Users: (p) => <IconWrapper {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>,
      Home: (p) => <IconWrapper {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconWrapper>,
      Plus: (p) => <IconWrapper {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconWrapper>,
      Check: (p) => <IconWrapper {...p}><polyline points="20 6 9 17 4 12"/></IconWrapper>,
      AlertTriangle: (p) => <IconWrapper {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconWrapper>,
      Calendar: (p) => <IconWrapper {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></IconWrapper>,
      Download: (p) => <IconWrapper {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconWrapper>,
      FileText: (p) => <IconWrapper {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></IconWrapper>,
      ArrowLeft: (p) => <IconWrapper {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconWrapper>,
      ChevronRight: (p) => <IconWrapper {...p}><polyline points="9 18 15 12 9 6"/></IconWrapper>,
      Wallet: (p) => <IconWrapper {...p}><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h4v-8Z"/></IconWrapper>,
      Clock: (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconWrapper>,
      ScanLine: (p) => <IconWrapper {...p}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></IconWrapper>,
      Box: (p) => <IconWrapper {...p}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></IconWrapper>,
      TrendingUp: (p) => <IconWrapper {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconWrapper>,
      Edit2: (p) => <IconWrapper {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconWrapper>,
      X: (p) => <IconWrapper {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconWrapper>,
      Receipt: (p) => <IconWrapper {...p}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><line x1="16" y1="8" x2="8" y2="8"/><line x1="16" y1="12" x2="8" y2="12"/><line x1="16" y1="16" x2="10" y2="16"/></IconWrapper>,
      User: (p) => <IconWrapper {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>,
      Wifi: (p) => <IconWrapper {...p}><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></IconWrapper>,
      WifiOff: (p) => <IconWrapper {...p}><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></IconWrapper>,
      CloudOff: (p) => <IconWrapper {...p}><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"/><line x1="1" y1="1" x2="23" y2="23"/></IconWrapper>,
      RefreshCw: (p) => <IconWrapper {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconWrapper>,
      Lightbulb: (p) => <IconWrapper {...p}><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 12 3 4.65 4.65 0 0 0 7.5 11.5c0 1.16.52 2.27 1.41 3.01.67.56 1.09 1.19 1.2 2.05"/></IconWrapper>,
      Fuel: (p) => <IconWrapper {...p}><line x1="3" y1="22" x2="15" y2="22"/><line x1="4" y1="9" x2="14" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></IconWrapper>
    };

    // Usamos el objeto Icons interno en lugar de lucideReact
    const { Camera, DollarSign, Users, Home, Plus, Check, AlertTriangle, Calendar, Download, FileText, ArrowLeft, ChevronRight, Wallet, Clock, ScanLine, Box, TrendingUp, Edit2, X, Receipt, User, Wifi, WifiOff, CloudOff, RefreshCw, Lightbulb, Fuel } = Icons;

    // --- UTILIDADES ---

    const formatDate = (dateString) => {
      if (!dateString) return '';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return String(dateString);
      const options = { day: '2-digit', month: 'short' };
      return date.toLocaleDateString('es-MX', options);
    };

    const getCurrentWeekRange = () => {
      const curr = new Date(); 
      const first = curr.getDate() - curr.getDay() + 1; 
      const last = first + 5; 

      const firstday = new Date(curr.setDate(first));
      const lastday = new Date(curr.setDate(last));
      
      const options = { day: 'numeric', month: 'short' };
      return `${firstday.toLocaleDateString('es-MX', options)} - ${lastday.toLocaleDateString('es-MX', options)}`;
    };

    const fileToBase64 = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
          const base64String = reader.result.split(',')[1];
          resolve(base64String);
        };
        reader.onerror = (error) => reject(error);
      });
    };

    // --- HOOK DE PERSISTENCIA ---
    function useStickyState(defaultValue, key) {
      const [value, setValue] = useState(() => {
        try {
          const stickyValue = window.localStorage.getItem(key);
          return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
        } catch (error) {
          return defaultValue;
        }
      });

      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {}
      }, [key, value]);

      return [value, setValue];
    }

    // --- API REAL DE GEMINI ---
    const callGeminiAPI = async (base64Image, mimeType) => {
      const apiKey = "AIzaSyBpVkPhF3koAVWkWAJgTMYxYNAIfJ-zyWI"; 
      
      const prompt = `
        Analiza esta imagen de un ticket, factura o recibo. 
        Extrae la información EXACTA que ves. No inventes datos.
        Responde SOLAMENTE con un objeto JSON válido (sin markdown, sin \`\`\`).
        
        Estructura JSON requerida:
        {
          "store_name": "Nombre del negocio",
          "date": "YYYY-MM-DD",
          "total_amount": 0.00 (número),
          "category_hint": "Materiales, Combustible, Servicios, Alimentos o General",
          "items": [
            { "raw_name": "Producto", "qty": 1, "unit_price": 0.00, "total": 0.00 }
          ]
        }
        
        Si no hay items, pon un solo item general. Si la fecha no es visible, usa hoy.
      `;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inlineData: { mimeType: mimeType, data: base64Image } }
              ]
            }]
          })
        });

        if (!response.ok) throw new Error(`Error API: ${response.statusText}`);

        const result = await response.json();
        const textResponse = result.candidates?.[0]?.content?.parts?.[0]?.text;
        const cleanJson = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
        return JSON.parse(cleanJson);

      } catch (error) {
        console.error("Gemini Error:", error);
        throw error;
      }
    };

    const standardizeMaterials = (rawItems) => {
      const dictionary = {
        'cemento': { name: 'Cemento Gris 50kg', category: 'Albañilería' },
        'cem': { name: 'Cemento Gris 50kg', category: 'Albañilería' },
        'tolteca': { name: 'Cemento Gris 50kg', category: 'Albañilería' },
        'varilla': { name: 'Varilla 3/8', category: 'Acero' },
        'clavo': { name: 'Clavos / Fijación', category: 'Consumibles' },
        'consumo': { name: 'Consumo Energía', category: 'Servicios' },
        'energía': { name: 'Consumo Energía', category: 'Servicios' },
        'cfe': { name: 'Pago CFE', category: 'Servicios' },
        'combustible': { name: 'Gasolina Magna', category: 'Maquinaria' },
        'magna': { name: 'Gasolina Magna', category: 'Maquinaria' },
        'diesel': { name: 'Diesel', category: 'Maquinaria' },
        'iva': { name: 'IVA', category: 'Impuestos' },
        'dap': { name: 'DAP (Alumbrado)', category: 'Impuestos' },
      };

      return rawItems.map(item => {
        const lowerName = item.raw_name ? String(item.raw_name).toLowerCase() : 'item';
        let standardized = { name: item.raw_name, category: 'General' }; 
        
        for (const [key, val] of Object.entries(dictionary)) {
          if (lowerName.includes(key)) {
            standardized = val;
            break;
          }
        }
        return { ...item, std_name: standardized.name, category: standardized.category };
      });
    };

    // --- DATOS INICIALES ---
    const INITIAL_EXPENSES = [
      { 
        id: 1, 
        amount: '2400', 
        concept: 'Ticket Construrama (Cemento)', 
        category: 'Albañilería', 
        date: '2023-12-05', 
        items: [
            { raw_name: "Cemento Tolteca", qty: 10, unit_price: 240, total: 2400 }
        ] 
      },
    ];
    const INITIAL_WORKERS = [
      { 
        id: 1, name: 'Juan Pérez', role: 'Oficial Albañil', defaultCategory: 'Albañilería', salary: 750, loans: [], 
        attendance: { Mon: true, Tue: true, Wed: true, Thu: true, Fri: true, Sat: true } 
      },
      { 
        id: 2, name: 'Beto "El Chispas"', role: 'Electricista', defaultCategory: 'Instalaciones', salary: 600, loans: [], 
        attendance: { Mon: true, Tue: true, Wed: true, Thu: true, Fri: true, Sat: true } 
      },
    ];
    const INITIAL_INVENTORY = {};
    const INITIAL_BUDGETS = { 'Albañilería': 50000, 'Acabados': 30000, 'Instalaciones': 25000, 'Servicios': 10000, 'Maquinaria': 20000, 'General': 15000 };

    // --- COMPONENTES UI ---

    const Button = ({ onClick, children, variant = 'primary', className = '', disabled = false }) => {
      const baseStyle = "w-full min-h-[60px] text-lg font-bold border-4 border-black active:translate-y-1 transition-transform flex items-center justify-center gap-2";
      const variants = {
        primary: "bg-black text-white hover:bg-gray-900",
        secondary: "bg-white text-black hover:bg-gray-100",
        danger: "bg-white text-black border-black hover:bg-red-100 pattern-diagonal-lines", 
        success: "bg-green-500 text-black border-black hover:bg-green-600",
        ai: "bg-indigo-600 text-white border-black hover:bg-indigo-700",
        warning: "bg-yellow-400 text-black border-black hover:bg-yellow-500",
      };
      return (
        <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}>
          {children}
        </button>
      );
    };

    const Card = ({ children, title, className = '', onClick }) => (
      <div onClick={onClick} className={`bg-white border-4 border-black p-4 mb-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] ${className} ${onClick ? 'cursor-pointer active:translate-y-1 transition-transform' : ''}`}>
        {title && <h2 className="text-xl font-black uppercase mb-4 border-b-4 border-black pb-2">{title}</h2>}
        {children}
      </div>
    );

    const Input = ({ label, type = "text", value, onChange, placeholder }) => (
      <div className="mb-4">
        <label className="block text-black font-bold text-lg mb-1 uppercase">{label}</label>
        <input type={type} value={value} onChange={onChange} placeholder={placeholder} className="w-full h-[60px] border-4 border-black p-2 text-xl font-bold placeholder-gray-500 focus:outline-none focus:bg-yellow-100" />
      </div>
    );

    // --- MÓDULOS DE LA APP ---

    // 1. DASHBOARD
    const SmartDashboard = ({ expenses, inventory, budgets, setBudgets }) => {
      const [activeView, setActiveView] = useState('money'); 
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [selectedMaterial, setSelectedMaterial] = useState(null);
      const [viewExpenseDetail, setViewExpenseDetail] = useState(null); 
      const [selectedWorkerItem, setSelectedWorkerItem] = useState(null);
      
      const [isEditingBudget, setIsEditingBudget] = useState(false);
      const [newBudgetVal, setNewBudgetVal] = useState('');
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

      const categoryTotals = expenses.reduce((acc, curr) => {
        const cat = curr.category || 'Varios';
        acc[cat] = (acc[cat] || 0) + parseFloat(curr.amount);
        return acc;
      }, {});

      const allCategories = [...new Set([...Object.keys(budgets), ...Object.keys(categoryTotals)])];

      const getStatusColor = (spent, total) => {
        if (total === 0) return 'bg-gray-400';
        const p = (spent / total) * 100;
        if (p > 90) return 'bg-red-500 pattern-grid';
        if (p > 70) return 'bg-yellow-400';
        return 'bg-green-500';
      };

      const handleUpdateBudget = () => {
        if (!newBudgetVal || isNaN(newBudgetVal)) return;
        setBudgets(prev => ({
            ...prev,
            [selectedCategory]: parseFloat(newBudgetVal)
        }));
        setIsEditingBudget(false);
      };

      // --- GENERACIÓN PDF ---
      const generateCategoryReport = async (category, expensesList, totalSpent, limit) => {
        setIsGeneratingPdf(true);
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();

          doc.setFontSize(22);
          doc.text("OBRA CONTROL 4x4", 14, 20);
          doc.setFontSize(14);
          doc.setFont(undefined, 'bold');
          doc.text(`REPORTE DETALLADO: ${category.toUpperCase()}`, 14, 30);
          doc.setFontSize(10);
          doc.setFont(undefined, 'normal');
          doc.text(`Fecha de corte: ${new Date().toLocaleDateString()}`, 14, 36);

          doc.setFillColor(240, 240, 240);
          doc.rect(14, 40, 180, 20, 'F');
          doc.setFont(undefined, 'bold');
          doc.text("PRESUPUESTO TOPE", 20, 48); doc.text(`$${limit.toLocaleString()}`, 20, 55);
          doc.text("TOTAL GASTADO", 100, 48); doc.text(`$${totalSpent.toLocaleString()}`, 100, 55);
          doc.text("DISPONIBLE", 160, 48); doc.text(`$${(limit - totalSpent).toLocaleString()}`, 160, 55);

          const tableRows = expensesList
            .sort((a, b) => new Date(a.date) - new Date(b.date))
            .map(e => {
              let desc = e.concept;
              if (e.items && e.items.length > 0) {
                e.items.forEach(item => {
                   const itemName = item.raw_name || item.std_name || 'Ítem';
                   const itemCost = item.total ? `$${item.total.toLocaleString()}` : `$${item.unit_price.toLocaleString()}`;
                   const extraInfo = item.qty ? `(${item.qty} días)` : '';
                   desc += `\n   • ${itemName} ${extraInfo} - ${itemCost}`;
                   if (item.loans > 0) desc += `\n     (Desc. Préstamo: -$${item.loans.toLocaleString()})`;
                });
              }
              return [formatDate(e.date), desc, `$${parseFloat(e.amount).toLocaleString()}`];
            });

          doc.autoTable({
            head: [["FECHA", "CONCEPTO / DETALLE DE COMPRA", "MONTO"]],
            body: tableRows,
            startY: 65,
            theme: 'grid',
            headStyles: { fillColor: [0, 0, 0], textColor: [255, 255, 255], fontStyle: 'bold' },
            columnStyles: { 2: { halign: 'right', fontStyle: 'bold' } },
            styles: { cellPadding: 3, fontSize: 9, overflow: 'linebreak' }
          });

          doc.save(`Reporte_Detallado_${category}_${new Date().toISOString().split('T')[0]}.pdf`);

        } catch (error) {
          console.error(error);
          alert("Error al generar PDF: " + error.message);
        } finally {
          setIsGeneratingPdf(false);
        }
      };

      if (selectedMaterial) {
        const relatedExpenses = expenses.filter(e => {
            if (e.category === 'Servicios' || e.category === 'Maquinaria') {
                return e.concept.includes(selectedMaterial.name.replace('Pago ', '').replace('Factura: ', ''));
            }
            return e.items && e.items.some(item => String(item.std_name) === selectedMaterial.name);
        });

        return (
            <div className="fixed inset-0 bg-white z-50 overflow-y-auto p-4">
                <div className="flex justify-between items-center mb-4 border-b-4 border-black pb-2">
                    <div>
                        <h2 className="text-xl font-black uppercase">{selectedMaterial.name}</h2>
                        <p className="text-sm text-gray-500 font-bold">{selectedMaterial.data.category}</p>
                    </div>
                    <button onClick={() => setSelectedMaterial(null)}><X size={32} /></button>
                </div>
                <div className="space-y-4">
                    {relatedExpenses.map(expense => (
                        <Card key={expense.id} title={expense.date}>
                            <div className="mb-2 flex justify-between"><span className="font-bold">{expense.concept}</span><span className="font-black text-lg">${parseFloat(expense.amount).toLocaleString()}</span></div>
                        </Card>
                    ))}
                </div>
            </div>
        );
      }

      if (selectedWorkerItem) {
          return (
            <div className="fixed inset-0 bg-black bg-opacity-80 z-[60] flex items-center justify-center p-4">
                <Card title={selectedWorkerItem.std_name} className="w-full max-w-sm animate-in zoom-in duration-200">
                    <div className="space-y-4">
                        <p className="text-gray-500 font-bold uppercase">{selectedWorkerItem.raw_name}</p>
                        <div className="bg-gray-100 p-3 rounded space-y-2 text-sm">
                            <div className="flex justify-between"><span>Sueldo Diario:</span><span className="font-bold">${selectedWorkerItem.unit_price}</span></div>
                            <div className="flex justify-between"><span>Días Trabajados:</span><span className="font-bold">{selectedWorkerItem.qty}</span></div>
                            <div className="flex justify-between border-t border-gray-300 pt-2 text-lg"><span>Bruto Devengado:</span><span className="font-black">${selectedWorkerItem.total.toLocaleString()}</span></div>
                        </div>
                        {selectedWorkerItem.loans > 0 ? (
                            <div className="bg-red-50 border-2 border-red-200 p-3 rounded text-red-800">
                                <div className="flex items-center gap-2 font-bold mb-1"><Wallet size={16} /> Préstamos Descontados</div>
                                <p className="text-2xl font-black">-${selectedWorkerItem.loans.toLocaleString()}</p>
                            </div>
                        ) : <div className="text-center text-gray-400 text-sm py-2">Sin préstamos esta semana.</div>}
                        <Button onClick={() => setSelectedWorkerItem(null)}>CERRAR</Button>
                    </div>
                </Card>
            </div>
          );
      }

      if (viewExpenseDetail) {
        return (
            <div className="space-y-4">
                <Button variant="secondary" onClick={() => setViewExpenseDetail(null)} className="mb-2"><ArrowLeft size={24} /> VOLVER A LISTA</Button>
                <Card title={viewExpenseDetail.concept.includes('Raya') ? 'Detalle de Nómina' : 'Detalle del Ticket'} className="border-indigo-600">
                    <div className="border-b-2 border-dashed border-gray-300 pb-4 mb-4">
                        <div className="flex justify-between items-center mb-2"><span className="text-gray-500 text-sm font-bold uppercase">Fecha</span><span className="font-black">{formatDate(viewExpenseDetail.date)}</span></div>
                        <div className="flex justify-between items-center"><span className="text-gray-500 text-sm font-bold uppercase">Categoría</span><span className="bg-black text-white text-xs px-2 py-1 font-bold">{viewExpenseDetail.category}</span></div>
                    </div>
                    <div className="space-y-2">
                        <p className="text-xs font-black uppercase bg-gray-100 p-1">{viewExpenseDetail.concept.includes('Raya') ? 'Lista de Raya (Clic para detalles)' : 'Productos / Ítems'}</p>
                        {viewExpenseDetail.items && viewExpenseDetail.items.length > 0 ? (
                            viewExpenseDetail.items.map((item, idx) => (
                                <div key={idx} onClick={() => item.loans !== undefined ? setSelectedWorkerItem(item) : null} className={`flex justify-between items-center border-b border-gray-100 py-2 ${item.loans !== undefined ? 'cursor-pointer hover:bg-blue-50 active:bg-blue-100 px-1' : ''}`}>
                                    <div className="flex items-center gap-2">
                                        {item.loans !== undefined && <User size={16} className="text-gray-400" />}
                                        <div><p className="font-bold text-sm">{item.raw_name || item.std_name || 'Ítem General'}</p><p className="text-xs text-gray-500">{item.std_name !== item.raw_name ? item.std_name : ''}</p></div>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-xs text-gray-500">{item.qty} x ${item.unit_price}</p>
                                        <p className="font-black">${parseFloat(item.total).toLocaleString()}</p>
                                        {item.loans > 0 && <p className="text-[10px] text-red-500 font-bold">(-${item.loans} Prest.)</p>}
                                    </div>
                                </div>
                            ))
                        ) : <p className="text-gray-400 italic text-sm text-center py-4">Sin desglose disponible</p>}
                    </div>
                    <div className="mt-4 pt-4 border-t-4 border-black flex justify-between items-center"><span className="font-black text-xl">TOTAL</span><span className="font-black text-3xl text-indigo-600">${parseFloat(viewExpenseDetail.amount).toLocaleString()}</span></div>
                </Card>
            </div>
        );
      }

      if (selectedCategory) {
        const categoryExpenses = expenses.filter(e => e.category === selectedCategory);
        const totalSpent = categoryTotals[selectedCategory] || 0;
        const budgetLimit = budgets[selectedCategory] || 0;

        return (
          <div className="space-y-4">
            <Button variant="secondary" onClick={() => { setSelectedCategory(null); setIsEditingBudget(false); }} className="mb-2"><ArrowLeft size={24} /> VOLVER A RESUMEN</Button>
            <Card title={`Bolsa: ${selectedCategory}`} className="bg-yellow-50">
               <div className="flex justify-between items-end mb-4">
                  <div>
                    <div className="flex items-center gap-2 mb-1"><p className="text-sm font-bold uppercase text-gray-500">Presupuesto Tope</p><button onClick={() => { setIsEditingBudget(!isEditingBudget); setNewBudgetVal(budgetLimit); }} className="text-indigo-600 hover:text-indigo-800"><Edit2 size={16} /></button></div>
                    {isEditingBudget ? (
                        <div className="flex items-center gap-2"><span className="font-black text-xl">$</span><input type="number" autoFocus className="text-2xl font-black w-32 border-b-4 border-black bg-transparent outline-none" value={newBudgetVal} onChange={(e) => setNewBudgetVal(e.target.value)} /><button onClick={handleUpdateBudget} className="bg-black text-white p-1 rounded"><Check size={20} /></button></div>
                    ) : <p className="text-2xl font-black">${budgetLimit > 0 ? budgetLimit.toLocaleString() : 'N/A'}</p>}
                  </div>
                  <div className="text-right"><p className="text-sm font-bold uppercase text-gray-500">Gastado Real</p><p className="text-3xl font-black text-red-600">-${totalSpent.toLocaleString()}</p></div>
               </div>
               {budgetLimit > 0 && <div className="w-full h-6 border-4 border-black bg-white relative"><div className={`h-full border-r-4 border-black ${getStatusColor(totalSpent, budgetLimit)}`} style={{ width: `${Math.min((totalSpent / budgetLimit) * 100, 100)}%` }}></div></div>}
            </Card>
            <Button onClick={() => generateCategoryReport(selectedCategory, categoryExpenses, totalSpent, budgetLimit)} disabled={isGeneratingPdf} className="mb-4 bg-gray-800 text-white border-black">{isGeneratingPdf ? 'GENERANDO PDF...' : <><FileText size={20} /> DESCARGAR REPORTE PDF</>}</Button>
            <div className="bg-white border-4 border-black p-0">
              <div className="bg-black text-white p-3 font-bold uppercase flex justify-between"><span>Ticket / Concepto</span><span>Monto</span></div>
              {categoryExpenses.length > 0 ? (
                <div className="divide-y-4 divide-black">
                  {categoryExpenses.map(expense => (
                    <div key={expense.id} onClick={() => setViewExpenseDetail(expense)} className="p-4 flex justify-between items-center hover:bg-indigo-50 cursor-pointer active:translate-x-1 transition-transform group">
                      <div>
                        <div className="font-black text-lg uppercase leading-tight group-hover:text-indigo-800 flex items-center gap-2">{expense.concept.includes('Raya') ? <Users size={16} /> : <Receipt size={16} />}{expense.concept}</div>
                        <div className="text-sm font-bold text-gray-500 mt-1 flex items-center gap-1"><Calendar size={14} /> {expense.date}{expense.items && expense.items.length > 0 && <span className="bg-gray-200 text-xs px-1 rounded ml-2">{expense.items.length} {expense.concept.includes('Raya') ? 'trab.' : 'ítems'}</span>}</div>
                      </div>
                      <div className="flex items-center gap-2"><div className="text-xl font-black">${parseFloat(expense.amount).toLocaleString()}</div><ChevronRight size={20} className="text-gray-300 group-hover:text-indigo-600" /></div>
                    </div>
                  ))}
                </div>
              ) : <div className="p-8 text-center text-gray-500 font-bold">NO HAY TICKETS REGISTRADOS</div>}
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-2 mb-4">
             <Button variant={activeView === 'money' ? 'primary' : 'secondary'} onClick={() => setActiveView('money')} className="min-h-[50px] text-sm"><DollarSign size={20} /> DINERO</Button>
             <Button variant={activeView === 'materials' ? 'primary' : 'secondary'} onClick={() => setActiveView('materials')} className="min-h-[50px] text-sm"><Box size={20} /> MATERIALES</Button>
          </div>
          {activeView === 'money' ? (
            <div className="space-y-2">
              {allCategories.map(category => {
                const spent = categoryTotals[category] || 0;
                const limit = budgets[category] || 0;
                if (limit === 0 && spent === 0) return null;
                const percentage = limit > 0 ? Math.min((spent / limit) * 100, 100) : 100;
                return (
                  <Card key={category} className="mb-2 hover:bg-gray-50 relative group" onClick={() => setSelectedCategory(category)}>
                    <div className="absolute right-4 top-1/2 -translate-y-1/2 opacity-20 group-hover:opacity-100 transition-opacity"><ChevronRight size={40} /></div>
                    <div className="flex justify-between items-end mb-2 pr-8"><span className="text-xl font-black">{category}</span><span className="text-lg font-bold">${spent.toLocaleString()} <span className="text-gray-400 text-sm">/ {limit > 0 ? limit.toLocaleString() : '∞'}</span></span></div>
                    <div className="w-full h-8 border-4 border-black bg-white relative"><div className={`h-full border-r-4 border-black ${getStatusColor(spent, limit)}`} style={{ width: `${percentage}%` }}></div></div>
                    {limit > 0 && <div className="text-right mt-1 font-bold text-sm text-gray-600">{percentage.toFixed(0)}% GASTADO</div>}
                  </Card>
                );
              })}
            </div>
          ) : (
            <Card title="Inventario Acumulado">
              {Object.keys(inventory).length === 0 ? <p className="text-gray-500 text-center py-4">Sube facturas para ver materiales.</p> : (
                <div className="space-y-3">
                  {Object.entries(inventory).map(([materialName, data]) => (
                    <div key={materialName} className="flex justify-between items-center border-b-2 border-gray-200 pb-2 cursor-pointer hover:bg-gray-50 active:translate-x-1 transition-transform" onClick={() => setSelectedMaterial({ name: materialName, data })}>
                       <div><p className="font-black text-lg">{materialName}</p><p className="text-xs font-bold text-gray-500 bg-gray-200 px-1 inline-block">{String(data.category)}</p></div>
                       <div className="text-right flex items-center gap-2"><div><p className="text-2xl font-black">{data.qty}</p><p className="text-xs text-gray-500 font-bold">{data.category === 'Servicios' || data.category === 'Maquinaria' ? 'PAGOS' : 'UNIDADES'}</p></div><ChevronRight size={20} className="text-gray-400" /></div>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          )}
        </div>
      );
    };

    // 2. MÓDULO: ESCÁNER IA (CON COLA DE PENDIENTES)
    const AIScannerModule = ({ expenses, setExpenses, inventory, setInventory, pendingQueue, setPendingQueue, isOffline }) => {
      const [analyzing, setAnalyzing] = useState(false);
      const [scannedData, setScannedData] = useState(null); 
      const [processedData, setProcessedData] = useState(null); 
      const [imagePreview, setImagePreview] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      const fileInputRef = useRef(null);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setImagePreview(reader.result);
          reader.readAsDataURL(file);
          processImage(file);
        }
      };

      const addToQueue = async (file) => {
        try {
            const base64 = await fileToBase64(file);
            const newTicket = { id: Date.now(), image: base64, mimeType: file.type, date: new Date().toLocaleDateString() };
            setPendingQueue(prev => [...prev, newTicket]);
            setImagePreview(null);
            alert("🔌 SIN CONEXIÓN: Ticket guardado en Cola de Pendientes.");
        } catch (error) { alert("Error al guardar en pendientes: " + error.message); }
      };

      const processImage = async (file) => {
        if (isOffline || !navigator.onLine) { addToQueue(file); return; }
        setAnalyzing(true); setScannedData(null); setProcessedData(null);
        try {
          const base64 = await fileToBase64(file);
          const llmResult = await callGeminiAPI(base64, file.type);
          setScannedData(llmResult);
          const standardizedItems = standardizeMaterials(llmResult.items || []);
          setProcessedData({ ...llmResult, items: standardizedItems, finalCategory: llmResult.category_hint || 'General' });
        } catch (error) { 
          console.error(error);
          if (confirm("Error de conexión. ¿Guardar en pendientes?")) { addToQueue(file); }
        } finally { setAnalyzing(false); }
      };

      const confirmUpload = () => {
        if (!processedData) return;
        const newExpense = {
          id: Date.now(),
          amount: processedData.total_amount.toString(),
          concept: `Factura: ${processedData.store_name}`,
          category: processedData.finalCategory, 
          date: formatDate(processedData.date),
          items: processedData.items
        };
        setExpenses(prev => [newExpense, ...prev]);
        const newInventory = { ...inventory };
        if (processedData.finalCategory === 'Servicios' || processedData.finalCategory === 'Maquinaria') {
            const key = processedData.store_name;
            if (!newInventory[key]) newInventory[key] = { qty: 0, category: processedData.finalCategory };
            newInventory[key].qty += 1;
        } else {
            processedData.items.forEach(item => {
                const key = String(item.std_name);
                if (item.qty > 0) {
                    if (!newInventory[key]) newInventory[key] = { qty: 0, category: String(item.category) };
                    newInventory[key].qty += Number(item.qty);
                }
            });
        }
        setInventory(newInventory);
        setImagePreview(null); setScannedData(null); setProcessedData(null);
        alert(`✅ Gasto de $${newExpense.amount} registrado.`);
      };

      const processPendingQueue = async () => {
          setIsSyncing(true);
          const queue = [...pendingQueue];
          for (const ticket of queue) {
              try {
                  const llmResult = await callGeminiAPI(ticket.image, ticket.mimeType);
                  const standardizedItems = standardizeMaterials(llmResult.items || []);
                  const newExpense = {
                      id: Date.now() + Math.random(),
                      amount: llmResult.total_amount.toString(),
                      concept: `Factura: ${llmResult.store_name} (Sincronizado)`,
                      category: llmResult.category_hint || 'General',
                      date: formatDate(llmResult.date || ticket.date),
                      items: standardizedItems
                  };
                  setExpenses(prev => [newExpense, ...prev]);
              } catch (error) { console.error("Error sincronizando ticket:", error); }
          }
          setPendingQueue([]); setIsSyncing(false);
          alert(`Sincronización terminada.`);
      };

      if (analyzing) return (
        <div className="flex flex-col items-center justify-center h-64 text-center space-y-4"><ScanLine size={64} className="animate-pulse text-indigo-600" /><div><h3 className="text-xl font-black">GEMINI ESTÁ PENSANDO...</h3><p className="text-sm text-gray-500">Extrayendo datos...</p></div></div>
      );

      if (processedData) return (
        <div className="space-y-4">
          <Card title="Revisión de Datos" className="border-indigo-600">
             <div className="mb-4 pb-4 border-b-2 border-dashed border-gray-300">
               <div className="flex justify-between items-center mb-2"><p className="text-sm text-gray-500">PROVEEDOR</p><button className="text-xs underline text-indigo-600 flex items-center gap-1"><Edit2 size={12}/> Editar</button></div>
               <input className="text-xl font-black w-full border-b border-gray-300 focus:border-black outline-none" value={processedData.store_name} onChange={(e) => setProcessedData({...processedData, store_name: e.target.value})} />
               <div className="mt-2"><label className="text-xs font-bold text-gray-500">CATEGORÍA DETECTADA</label><select className="w-full font-bold bg-gray-100 p-1 border-2 border-gray-300" value={processedData.finalCategory} onChange={(e) => setProcessedData({...processedData, finalCategory: e.target.value})}><option value="Albañilería">Albañilería</option><option value="Instalaciones">Instalaciones</option><option value="Servicios">Servicios (Luz/Agua)</option><option value="Maquinaria">Maquinaria/Gasolina</option><option value="General">General</option><option value="Materiales">Materiales</option><option value="Alimentos">Alimentos</option></select></div>
             </div>
             <div className="space-y-3"><p className="text-xs font-black bg-black text-white px-2 py-1 inline-block">DETALLE EXTRAÍDO</p>{processedData.items.map((item, idx) => (<div key={idx} className="flex justify-between items-start text-sm border-b border-gray-100 pb-1"><div><p className="font-bold">{String(item.std_name)}</p><p className="text-[10px] text-gray-400">{String(item.raw_name)}</p></div><div className="text-right"><p className="font-black">${Number(item.total).toLocaleString()}</p></div></div>))}</div>
             <div className="mt-4 pt-4 border-t-4 border-black flex justify-between items-center"><span className="font-black text-xl">TOTAL A PAGAR</span><div className="flex items-center gap-1 text-3xl font-black text-indigo-600"><span>$</span><input type="number" className="w-32 bg-transparent text-right outline-none border-b-2 border-transparent focus:border-indigo-600" value={processedData.total_amount} onChange={(e) => setProcessedData({...processedData, total_amount: e.target.value})} /></div></div>
          </Card>
          <div className="grid grid-cols-2 gap-2"><Button variant="secondary" onClick={() => {setImagePreview(null); setProcessedData(null);}}>CANCELAR</Button><Button variant="ai" onClick={confirmUpload}><Check size={20} /> CONFIRMAR</Button></div>
        </div>
      );

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center px-2"><p className="font-bold text-gray-500 text-sm">Motor IA: Google Gemini (Activado)</p></div>
          {pendingQueue.length > 0 && (<div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4 animate-in slide-in-from-top duration-300"><div className="flex justify-between items-center mb-2"><div className="flex items-center gap-2 font-bold text-yellow-800"><CloudOff size={20} /><span>{pendingQueue.length} Tickets Pendientes</span></div></div><p className="text-xs text-yellow-700 mb-3">Se guardaron fotos mientras no tenías conexión.</p><Button variant="warning" onClick={processPendingQueue} disabled={isSyncing || isOffline} className="text-sm h-10 w-full">{isSyncing ? 'PROCESANDO...' : `🔄 SINCRONIZAR AHORA`}</Button></div>)}
          <div className="border-4 border-dashed border-black rounded-xl p-8 text-center bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer" onClick={() => fileInputRef.current.click()}>
            <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
            <div className="flex flex-col items-center gap-4"><div className="bg-black text-white p-4 rounded-full"><Camera size={40} /></div><h3 className="text-xl font-black">ESCANEAR TICKET / FACTURA</h3><p className="text-sm font-bold text-gray-500 max-w-[200px]">Sube una foto y la IA leerá el total, la tienda y los productos automáticamente.</p></div>
          </div>
        </div>
      );
    };

    // 3. MÓDULO: NÓMINA (RAYA)
    const PayrollModule = ({ expenses, setExpenses, workers, setWorkers, payrollHistory, setPayrollHistory }) => {
      const [viewHistory, setViewHistory] = useState(false);
      const [showAddWorker, setShowAddWorker] = useState(false);
      const [showLoanModal, setShowLoanModal] = useState(false);
      const [showConfirmModal, setShowConfirmModal] = useState(false);
      const [newWorker, setNewWorker] = useState({ name: '', role: '', weeklySalary: '', category: 'Albañilería' });
      const [loanData, setLoanData] = useState({ workerId: '', amount: '' });
      const days = ['L', 'M', 'M', 'J', 'V', 'S'];
      const dayKeys = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      const getPendingLoansTotal = (worker) => worker.loans?.filter(l => l.status === 'pending').reduce((acc, c) => acc + c.amount, 0) || 0;
      const calculateTotal = (worker) => {
        const daysWorked = Object.values(worker.attendance).filter(Boolean).length;
        return (daysWorked * worker.salary) - getPendingLoansTotal(worker);
      };
      const totalNominaNeto = workers.reduce((acc, curr) => acc + calculateTotal(curr), 0);

      const toggleAttendance = (workerId, dayKey) => {
        setWorkers(workers.map(w => w.id === workerId ? { ...w, attendance: { ...w.attendance, [dayKey]: !w.attendance[dayKey] } } : w));
      };

      const handleAddWorker = () => {
        if (!newWorker.name || !newWorker.weeklySalary) return;
        setWorkers([...workers, {
          id: Date.now(),
          name: newWorker.name,
          role: newWorker.role,
          defaultCategory: newWorker.category,
          salary: parseFloat(newWorker.weeklySalary) / 6,
          loans: [],
          attendance: { Mon: true, Tue: true, Wed: true, Thu: true, Fri: true, Sat: true }
        }]);
        setShowAddWorker(false);
      };

      const handleAddLoan = () => {
        if (!loanData.workerId || !loanData.amount) return;
        const newLoan = { id: Date.now(), date: new Date().toISOString().split('T')[0], amount: parseFloat(loanData.amount), status: 'pending' };
        setWorkers(workers.map(w => w.id.toString() === loanData.workerId.toString() ? { ...w, loans: [newLoan, ...(w.loans || [])] } : w));
        setShowLoanModal(false); setLoanData({ workerId: '', amount: '' });
      };

      const executePayment = () => {
        const expensesByCategory = {};
        workers.forEach(worker => {
            const daysWorked = Object.values(worker.attendance).filter(Boolean).length;
            const grossAmount = daysWorked * worker.salary;
            const pendingLoans = getPendingLoansTotal(worker);
            if (grossAmount > 0) {
                const cat = worker.defaultCategory; 
                if (!expensesByCategory[cat]) expensesByCategory[cat] = { totalAmount: 0, items: [] };
                expensesByCategory[cat].totalAmount += grossAmount;
                expensesByCategory[cat].items.push({ std_name: worker.name, raw_name: worker.role, qty: daysWorked, unit_price: worker.salary, total: grossAmount, loans: pendingLoans });
            }
        });
        const newExpenses = Object.entries(expensesByCategory).map(([cat, data]) => ({
            id: Date.now() + Math.random(),
            amount: data.totalAmount.toString(),
            concept: `Raya Semanal: ${getCurrentWeekRange()}`,
            category: cat,
            date: new Date().toLocaleDateString(),
            items: data.items
        }));
        setExpenses(prev => [...newExpenses, ...prev]);
        setPayrollHistory(prev => [{ id: Date.now(), date: getCurrentWeekRange(), total: totalNominaNeto, details: JSON.parse(JSON.stringify(workers)) }, ...prev]);
        setWorkers(workers.map(w => ({ ...w, loans: (w.loans || []).map(l => l.status === 'pending' ? { ...l, status: 'paid', paidDate: new Date().toISOString().split('T')[0] } : l), attendance: { Mon: false, Tue: false, Wed: false, Thu: false, Fri: false, Sat: false } })));
        setShowConfirmModal(false);
        alert("Semana cerrada.");
      };

      const generatePDF = async () => {
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          doc.setFontSize(22); doc.text("OBRA CONTROL 4x4", 14, 20);
          doc.setFontSize(12); doc.text(`REPORTE DE RAYA: ${getCurrentWeekRange()}`, 14, 28);
          const tableRows = workers.map(worker => [worker.name, worker.role, Object.values(worker.attendance).filter(Boolean).length, `$${worker.salary.toFixed(2)}`, `$${getPendingLoansTotal(worker).toLocaleString()}`, `$${calculateTotal(worker).toLocaleString()}`]);
          doc.autoTable({ head: [["Nombre", "Puesto", "Días", "Diario", "Préstamo", "A Pagar"]], body: tableRows, startY: 40 });
          doc.save(`Nomina_${new Date().toISOString().split('T')[0]}.pdf`);
        } catch (error) { alert("Error PDF: " + error.message); }
      };

      if (viewHistory) return (<div className="space-y-4"><Button variant="secondary" onClick={() => setViewHistory(false)}><ArrowLeft /> VOLVER</Button><Card title="Historial">{payrollHistory.map(w => <div key={w.id} className="border-b py-2 flex justify-between"><span>{w.date}</span><span className="font-black">${w.total.toLocaleString()}</span></div>)}</Card></div>);
      if (showConfirmModal) return (<div className="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4"><Card title="CONFIRMAR PAGO" className="w-full max-w-sm"><p className="text-center font-black text-3xl my-4">${totalNominaNeto.toLocaleString()}</p><div className="grid grid-cols-2 gap-4"><Button variant="secondary" onClick={() => setShowConfirmModal(false)}>CANCELAR</Button><Button variant="success" onClick={executePayment}>PAGAR</Button></div></Card></div>);
      if (showAddWorker) return (<Card title="Nuevo"><Input label="Nombre" value={newWorker.name} onChange={e => setNewWorker({...newWorker, name: e.target.value})} /><Input label="Sueldo Semanal" type="number" value={newWorker.weeklySalary} onChange={e => setNewWorker({...newWorker, weeklySalary: e.target.value})} /><div className="mb-4"><label className="block text-black font-bold text-lg mb-1 uppercase">Partida</label><select className="w-full h-[60px] border-4 border-black p-2 font-bold" value={newWorker.category} onChange={e => setNewWorker({...newWorker, category: e.target.value})}><option value="Albañilería">Albañilería</option><option value="Instalaciones">Instalaciones</option><option value="Acabados">Acabados</option></select></div><div className="grid grid-cols-2 gap-4"><Button variant="secondary" onClick={() => setShowAddWorker(false)}>CANCELAR</Button><Button onClick={handleAddWorker}>GUARDAR</Button></div></Card>);
      if (showLoanModal) return (<Card title="Préstamo"><div className="mb-4"><label className="block font-bold text-lg">Trabajador</label><select className="w-full h-[60px] border-4 border-black p-2 font-bold bg-white" value={loanData.workerId} onChange={e => setLoanData({...loanData, workerId: e.target.value})}><option value="">Seleccionar</option>{workers.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}</select></div><Input label="Monto" type="number" value={loanData.amount} onChange={e => setLoanData({...loanData, amount: e.target.value})} /><div className="grid grid-cols-2 gap-4"><Button variant="secondary" onClick={() => setShowLoanModal(false)}>CANCELAR</Button><Button variant="danger" onClick={handleAddLoan}>PRESTAR</Button></div></Card>);

      return (
        <div className="space-y-4">
           <div className="flex justify-between items-end mb-4 border-b-4 border-black pb-2"><div><h2 className="text-xl font-black">SEMANA ACTUAL</h2><div className="flex items-center gap-1 font-bold text-sm text-gray-600"><Calendar size={14} /> {getCurrentWeekRange()}</div></div><button onClick={() => setViewHistory(true)} className="flex items-center gap-1 font-bold underline text-sm bg-gray-200 px-2 py-1 rounded"><Clock size={16} /> HISTORIAL</button></div>
           <div className="grid grid-cols-2 gap-2 mb-2"><Button variant="secondary" onClick={() => setShowAddWorker(true)} className="h-12 min-h-0 text-sm"><Plus size={16}/> TRABAJADOR</Button><Button variant="secondary" onClick={() => setShowLoanModal(true)} className="h-12 min-h-0 text-sm border-red-500 text-red-600"><Wallet size={16}/> PRÉSTAMO</Button></div>
           <Card className="p-0 overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-left"><thead className="bg-black text-white text-xs uppercase"><tr><th className="p-2">Nombre</th><th className="p-2 text-center">Asist</th><th className="p-2 text-right">$$$</th></tr></thead><tbody>{workers.map(w => (<tr key={w.id} className="border-b-4 border-black"><td className="p-2 font-bold" onClick={() => {}}>{w.name.split(' ')[0]}<br/><span className="text-xs text-gray-500">{w.role}</span>{getPendingLoansTotal(w) > 0 && <div className="text-xs text-red-600 font-bold">- ${getPendingLoansTotal(w)} (Deuda)</div>}</td><td className="p-1"><div className="grid grid-cols-3 gap-1">{dayKeys.map((k,i) => <button key={k} onClick={() => toggleAttendance(w.id, k)} className={`w-6 h-6 border-2 border-black text-[10px] font-bold ${w.attendance[k]?'bg-black text-white':'bg-white text-gray-300'}`}>{days[i]}</button>)}</div></td><td className="p-2 text-right font-black">${calculateTotal(w).toLocaleString()}</td></tr>))}</tbody></table></div></Card>
           <div className="sticky bottom-4 grid grid-cols-5 gap-2"><Button variant="success" className="col-span-4" onClick={() => setShowConfirmModal(true)}><Check /> CERRAR SEMANA</Button><Button className="col-span-1 bg-gray-800 border-black text-white" onClick={generatePDF}><FileText /></Button></div>
        </div>
      );
    };

    // --- APP PRINCIPAL ---

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [isOffline, setIsOffline] = useState(false);
      
      const [expenses, setExpenses] = useStickyState(INITIAL_EXPENSES, 'obra_expenses');
      const [workers, setWorkers] = useStickyState(INITIAL_WORKERS, 'obra_workers');
      const [payrollHistory, setPayrollHistory] = useStickyState([], 'obra_history');
      const [inventory, setInventory] = useStickyState(INITIAL_INVENTORY, 'obra_inventory');
      const [budgets, setBudgets] = useStickyState(INITIAL_BUDGETS, 'obra_budgets');
      const [pendingQueue, setPendingQueue] = useStickyState([], 'obra_pending_queue');

      const downloadAppHTML = () => {
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ObraControl_Offline.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const renderContent = () => {
        switch(activeTab) {
          case 'home': return <SmartDashboard expenses={expenses} inventory={inventory} budgets={budgets} setBudgets={setBudgets} />;
          case 'scanner': return <AIScannerModule expenses={expenses} setExpenses={setExpenses} inventory={inventory} setInventory={setInventory} pendingQueue={pendingQueue} setPendingQueue={setPendingQueue} isOffline={isOffline} />;
          case 'payroll': return <PayrollModule expenses={expenses} setExpenses={setExpenses} workers={workers} setWorkers={setWorkers} payrollHistory={payrollHistory} setPayrollHistory={setPayrollHistory} />;
          default: return <SmartDashboard expenses={expenses} inventory={inventory} budgets={budgets} setBudgets={setBudgets} />;
        }
      };

      return (
        <div className="min-h-screen bg-gray-100 flex justify-center items-start pt-0 md:pt-10 font-sans relative">
          <button onClick={downloadAppHTML} className="absolute top-4 right-4 md:right-10 bg-gray-900 text-white p-3 rounded-full shadow-xl hover:bg-gray-700 transition-all z-50 flex items-center gap-2 text-xs font-bold" title="Descargar App"><Download size={16} /><span className="hidden md:inline">HTML</span></button>
          <div className="w-full max-w-md bg-white min-h-screen md:min-h-[800px] md:h-[800px] md:border-8 md:border-black md:rounded-3xl shadow-2xl overflow-hidden flex flex-col relative">
            <div className="bg-black text-white p-4 flex justify-between items-center border-b-4 border-white md:border-black">
              <div><h1 className="text-xl font-black tracking-wider">OBRA CONTROL AI</h1><p className="text-xs text-gray-400">PWA MOBILE-FIRST</p></div>
              <button onClick={() => setIsOffline(!isOffline)} className={`px-2 py-1 rounded font-bold text-xs ${isOffline ? 'bg-red-500' : 'bg-green-500 text-black'}`}>{isOffline ? 'OFFLINE' : 'ONLINE'}</button>
            </div>
            <div className="flex-1 overflow-y-auto p-4 bg-white">{renderContent()}</div>
            <div className="bg-white border-t-4 border-black flex justify-around p-1 pb-4 md:pb-1">
              {[{ id: 'home', icon: Home, label: 'Dash' }, { id: 'scanner', icon: ScanLine, label: 'Escanear' }, { id: 'payroll', icon: Users, label: 'Nómina' }].map((item) => (
                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex flex-col items-center justify-center p-2 w-full ${activeTab === item.id ? 'bg-black text-white' : 'text-black'}`}><item.icon size={28} strokeWidth={activeTab === item.id ? 3 : 2} /><span className="text-[10px] font-bold uppercase mt-1">{item.label}</span></button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
