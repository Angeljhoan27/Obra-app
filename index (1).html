<body class="font-sans text-black">

    <!-- Botón Descargar Código Fuente -->
    <button onclick="downloadSource()" class="fixed top-4 right-4 md:right-10 bg-gray-900 text-white p-3 rounded-full shadow-xl hover:bg-gray-700 z-50 text-xs font-bold flex items-center gap-2">
        📥 <span>HTML</span>
    </button>

    <div class="min-h-screen flex justify-center items-start pt-0 md:pt-10">
        <!-- Contenedor Principal (Simulador Móvil) -->
        <div class="w-full max-w-md bg-white min-h-screen md:min-h-[800px] md:h-[800px] md:border-8 md:border-black md:rounded-3xl shadow-2xl overflow-hidden flex flex-col relative">
            
            <!-- Header -->
            <div class="bg-black text-white p-4 flex justify-between items-center border-b-4 border-white md:border-black">
                <div>
                    <h1 class="text-xl font-black tracking-wider">OBRA CONTROL 4x4</h1>
                    <p class="text-xs text-gray-400">VANILLA JS VERSION</p>
                </div>
                <button id="btnOffline" class="px-2 py-1 rounded font-bold text-xs bg-green-500 text-black">
                    ONLINE
                </button>
            </div>

            <!-- Área de Contenido -->
            <div id="contentArea" class="flex-1 overflow-y-auto p-4 bg-white relative"><div class="flex justify-between items-end mb-4 border-b-4 border-black pb-2">
                <div>
                    <h2 class="text-xl font-black">SEMANA ACTUAL</h2>
                    <div class="font-bold text-sm text-gray-500">📅 1/12 - 6/12</div>
                </div>
                <button onclick="toggleHistory()" class="underline font-bold text-sm">📜 HISTORIAL</button>
            </div><div class="grid grid-cols-2 gap-2 mb-2">
                <button onclick="openModal('modalAddWorker')" class="h-12 font-bold border-4 border-black text-sm bg-white hover:bg-gray-100">➕ TRABAJADOR</button>
                <button onclick="openModal('modalLoan')" class="h-12 font-bold border-4 border-red-500 text-red-600 text-sm bg-white hover:bg-red-50">💸 PRÉSTAMO</button>
            </div><div class="bg-white border-4 border-black overflow-hidden"><table class="w-full text-left"><thead class="bg-black text-white text-xs uppercase"><tr><th class="p-2">Nombre</th><th class="p-2 text-center">Asist</th><th class="p-2 text-right">$$$</th></tr></thead><tbody>
                    <tr class="border-b-4 border-black">
                        <td class="p-2 font-bold cursor-pointer hover:text-blue-600" onclick="alertWorkerDetail(1)">
                            Juan<br>
                            <span class="text-xs text-gray-500">Oficial Albañil</span>
                            
                        </td>
                        <td class="p-1"><div class="grid grid-cols-3 gap-1"><button onclick="toggleAttendance(1, 'Mon')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">M</button><button onclick="toggleAttendance(1, 'Tue')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">T</button><button onclick="toggleAttendance(1, 'Wed')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">W</button><button onclick="toggleAttendance(1, 'Thu')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">T</button><button onclick="toggleAttendance(1, 'Fri')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">F</button><button onclick="toggleAttendance(1, 'Sat')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">S</button></div></td>
                        <td class="p-2 text-right font-black">$4,500</td>
                    </tr>
                
                    <tr class="border-b-4 border-black">
                        <td class="p-2 font-bold cursor-pointer hover:text-blue-600" onclick="alertWorkerDetail(2)">
                            Beto<br>
                            <span class="text-xs text-gray-500">Electricista</span>
                            
                        </td>
                        <td class="p-1"><div class="grid grid-cols-3 gap-1"><button onclick="toggleAttendance(2, 'Mon')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">M</button><button onclick="toggleAttendance(2, 'Tue')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">T</button><button onclick="toggleAttendance(2, 'Wed')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">W</button><button onclick="toggleAttendance(2, 'Thu')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">T</button><button onclick="toggleAttendance(2, 'Fri')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">F</button><button onclick="toggleAttendance(2, 'Sat')" class="w-6 h-6 border-2 border-black text-[10px] font-bold bg-black text-white">S</button></div></td>
                        <td class="p-2 text-right font-black">$3,600</td>
                    </tr>
                </tbody></table></div><div class="sticky bottom-0 bg-white pt-2 border-t-4 border-black mt-4 grid grid-cols-5 gap-2">
                <button onclick="preCloseWeek(8100)" class="col-span-4 bg-green-500 border-4 border-black font-black h-12 flex items-center justify-center gap-2 hover:bg-green-400">
                    ✅ CERRAR SEMANA
                </button>
                <button onclick="exportPayrollPDF()" class="col-span-1 bg-gray-800 border-4 border-black text-white flex items-center justify-center">
                    📄
                </button>
            </div></div>

            <!-- Barra de Navegación -->
            <div class="bg-white border-t-4 border-black flex justify-around p-1 pb-4 md:pb-1">
                <button onclick="router('home')" class="nav-btn flex flex-col items-center justify-center p-2 w-full hover:bg-gray-100 text-black" id="nav-home">
                    <span class="text-2xl">🏠</span>
                    <span class="text-[10px] font-bold uppercase mt-1">Dash</span>
                </button>
                <button onclick="router('scanner')" class="nav-btn flex flex-col items-center justify-center p-2 w-full hover:bg-gray-100 text-black" id="nav-scanner">
                    <span class="text-2xl">📸</span>
                    <span class="text-[10px] font-bold uppercase mt-1">Escanear</span>
                </button>
                <button onclick="router('payroll')" class="nav-btn flex flex-col items-center justify-center p-2 w-full hover:bg-gray-100 bg-black text-white" id="nav-payroll">
                    <span class="text-2xl">👷</span>
                    <span class="text-[10px] font-bold uppercase mt-1">Nómina</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODALES (Ocultos por defecto) -->
    
    <!-- Modal Confirmación Pago -->
    <div id="modalConfirmPay" class="modal-overlay hidden">
        <div class="bg-white border-4 border-black p-4 w-full max-w-sm shadow-2xl fade-in">
            <h2 class="text-xl font-black uppercase mb-4 border-b-4 border-black pb-2">CONFIRMAR PAGO</h2>
            <p class="text-center font-black text-3xl my-6" id="confirmPayAmount">$8,100</p>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="closeModal('modalConfirmPay')" class="w-full h-[60px] text-lg font-bold border-4 border-black bg-white text-black">CANCELAR</button>
                <button onclick="executePayment()" class="w-full h-[60px] text-lg font-bold border-4 border-black bg-green-500 text-black">PAGAR</button>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Trabajador -->
    <div id="modalAddWorker" class="modal-overlay hidden">
        <div class="bg-white border-4 border-black p-4 w-full max-w-sm shadow-2xl fade-in">
            <h2 class="text-xl font-black uppercase mb-4 border-b-4 border-black pb-2">NUEVO TRABAJADOR</h2>
            <div class="mb-4">
                <label class="block text-black font-bold text-lg mb-1">Nombre</label>
                <input type="text" id="newWorkerName" class="w-full h-[50px] border-4 border-black p-2 font-bold bg-gray-50">
            </div>
            <div class="mb-4">
                <label class="block text-black font-bold text-lg mb-1">Puesto</label>
                <input type="text" id="newWorkerRole" class="w-full h-[50px] border-4 border-black p-2 font-bold bg-gray-50" placeholder="Ej. Albañil">
            </div>
            <div class="mb-4">
                <label class="block text-black font-bold text-lg mb-1">Sueldo Semanal</label>
                <input type="number" id="newWorkerSalary" class="w-full h-[50px] border-4 border-black p-2 font-bold bg-gray-50">
            </div>
            <div class="mb-6">
                <label class="block text-black font-bold text-lg mb-1">Categoría</label>
                <select id="newWorkerCategory" class="w-full h-[50px] border-4 border-black p-2 font-bold bg-white">
                    <option value="Albañilería">Albañilería</option>
                    <option value="Instalaciones">Instalaciones</option>
                    <option value="Acabados">Acabados</option>
                    <option value="General">General</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="closeModal('modalAddWorker')" class="w-full h-[50px] font-bold border-4 border-black">CANCELAR</button>
                <button onclick="saveNewWorker()" class="w-full h-[50px] font-bold border-4 border-black bg-black text-white">GUARDAR</button>
            </div>
        </div>
    </div>

    <!-- Modal Préstamo -->
    <div id="modalLoan" class="modal-overlay hidden">
        <div class="bg-white border-4 border-black p-4 w-full max-w-sm shadow-2xl fade-in">
            <h2 class="text-xl font-black uppercase mb-4 border-b-4 border-black pb-2">REGISTRAR PRÉSTAMO</h2>
            <div class="mb-4">
                <label class="block text-black font-bold text-lg mb-1">Trabajador</label>
                <select id="loanWorkerId" class="w-full h-[50px] border-4 border-black p-2 font-bold bg-white">
                    <!-- Options populated by JS -->
                </select>
            </div>
            <div class="mb-6">
                <label class="block text-black font-bold text-lg mb-1">Monto ($)</label>
                <input type="number" id="loanAmount" class="w-full h-[50px] border-4 border-black p-2 font-bold bg-gray-50">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="closeModal('modalLoan')" class="w-full h-[50px] font-bold border-4 border-black">CANCELAR</button>
                <button onclick="saveLoan()" class="w-full h-[50px] font-bold border-4 border-black bg-red-500 text-white">PRESTAR</button>
            </div>
        </div>
    </div>

    <!-- Modal Edición Presupuesto -->
    <div id="modalEditBudget" class="modal-overlay hidden">
        <div class="bg-white border-4 border-black p-4 w-full max-w-sm shadow-2xl fade-in">
            <h2 class="text-xl font-black uppercase mb-4">EDITAR PRESUPUESTO</h2>
            <p id="editBudgetTitle" class="mb-4 font-bold text-gray-500">PARTIDA</p>
            <input type="number" id="newBudgetAmount" class="w-full h-[60px] border-4 border-black p-2 text-2xl font-black mb-6">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="closeModal('modalEditBudget')" class="w-full h-[50px] font-bold border-4 border-black">CANCELAR</button>
                <button onclick="saveBudget()" class="w-full h-[50px] font-bold border-4 border-black bg-black text-white">GUARDAR</button>
            </div>
        </div>
    </div>

    <script>
        // --- ESTADO GLOBAL (DATABASE) ---
        const DB_KEYS = {
            EXPENSES: 'obra_expenses',
            WORKERS: 'obra_workers',
            HISTORY: 'obra_history',
            INVENTORY: 'obra_inventory',
            BUDGETS: 'obra_budgets',
            PENDING: 'obra_pending'
        };

        const INITIAL_DATA = {
            EXPENSES: [{ id: 1, amount: '2400', concept: 'Ticket Construrama (Cemento)', category: 'Albañilería', date: '2023-12-05', items: [{ raw_name: "Cemento Tolteca", qty: 10, unit_price: 240, total: 2400 }] }],
            WORKERS: [
                { id: 1, name: 'Juan Pérez', role: 'Oficial Albañil', defaultCategory: 'Albañilería', salary: 750, loans: [], attendance: { Mon: true, Tue: true, Wed: true, Thu: true, Fri: true, Sat: true } },
                { id: 2, name: 'Beto "El Chispas"', role: 'Electricista', defaultCategory: 'Instalaciones', salary: 600, loans: [], attendance: { Mon: true, Tue: true, Wed: true, Thu: true, Fri: true, Sat: true } }
            ],
            BUDGETS: { 'Albañilería': 50000, 'Acabados': 30000, 'Instalaciones': 25000, 'Servicios': 10000, 'Maquinaria': 20000, 'General': 15000 }
        };

        // --- MANEJO DE ESTADO ---
        function getState(key, defaultVal) {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : defaultVal;
        }

        function setState(key, val) {
            localStorage.setItem(key, JSON.stringify(val));
            render(); // Re-render global simple
        }

        let state = {
            view: 'home', // home, scanner, payroll
            subView: null, // Para detalles
            expenses: getState(DB_KEYS.EXPENSES, INITIAL_DATA.EXPENSES),
            workers: getState(DB_KEYS.WORKERS, INITIAL_DATA.WORKERS),
            history: getState(DB_KEYS.HISTORY, []),
            inventory: getState(DB_KEYS.INVENTORY, {}),

        // --- UTILIDADES ---
        const formatMoney = (amount) => '$' + parseFloat(amount).toLocaleString('es-MX');
        const formatDate = (dateString) => {
            if(!dateString) return '';
            const d = new Date(dateString);
            return isNaN(d) ? dateString : d.toLocaleDateString('es-MX', {day: '2-digit', month: 'short'});
        };
        const getWeekRange = () => {
            const d = new Date();
            const first = d.getDate() - d.getDay() + 1;
            const last = first + 5;
            const d1 = new Date(d.setDate(first));
            const d2 = new Date(d.setDate(last));
            return `${d1.getDate()}/${d1.getMonth()+1} - ${d2.getDate()}/${d2.getMonth()+1}`;
        };

        // --- ROUTING ---
        function router(view, params = null) {
            state.view = view;
            if(params) state.subView = params;
            else state.subView = null;
            
            // Actualizar botones nav
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-black', 'text-white');
                btn.classList.add('text-black');
            });
            const activeBtn = document.getElementById(`nav-${view}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-black');
                activeBtn.classList.add('bg-black', 'text-white');
            }
            
            render();
        }

        async function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            // Modo Offline o Sin Red
            if (state.isOffline || !navigator.onLine) {
                const base64 = await toBase64(file);
                const ticket = { id: Date.now(), image: base64, mimeType: file.type, date: new Date().toISOString() };
                state.pending.push(ticket);
                setState(DB_KEYS.PENDING, state.pending);
                alert("🔌 SIN CONEXIÓN: Guardado en cola de pendientes.");
                render();
                return;
            }

            state.isScanning = true;
            render();

            try {
                const base64 = await toBase64(file);
                const apiKey = "AIzaSyBpVkPhF3koAVWkWAJgTMYxYNAIfJ-zyWI"; // Key Hardcoded
                
                const prompt = `Analiza imagen. Extrae JSON exacto: { "store_name": "string", "date": "YYYY-MM-DD", "total_amount": number, "category_hint": "Materiales|Combustible|Servicios|General", "items": [{ "raw_name": "string", "qty": number, "unit_price": number, "total": number }] }. Si no hay items, inventa uno general.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: file.type, data: base64 } }] }] })
                });

                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                const json = JSON.parse(text);

                // Estandarizar
                const standardizedItems = json.items.map(i => {
                    let cat = 'General';
                    let name = i.raw_name;
                    if(name.match(/cemento|mortero/i)) { cat = 'Albañilería'; name='Cemento/Mortero'; }
                    if(name.match(/gasolina|magna/i)) { cat = 'Maquinaria'; name='Gasolina'; }
                    if(name.match(/cfe|luz/i)) { cat = 'Servicios'; name='Pago Luz'; }
                    return { ...i, std_name: name, category: cat };
                });

                // Guardar
                const newExpense = {
                    id: Date.now(),
                    amount: json.total_amount,
                    concept: `Factura: ${json.store_name}`,
                    category: json.category_hint || 'General',
                    date: json.date,
                    items: standardizedItems
                };

                state.expenses.unshift(newExpense);
                setState(DB_KEYS.EXPENSES, state.expenses);

                // Actualizar Inventario
                const newInv = { ...state.inventory };
                if (['Servicios', 'Maquinaria'].includes(newExpense.category)) {
                    const k = json.store_name;
                    if(!newInv[k]) newInv[k] = { qty: 0, category: newExpense.category };
                    newInv[k].qty += 1;
                } else {
                    standardizedItems.forEach(i => {
                        const k = i.std_name;
                        if(!newInv[k]) newInv[k] = { qty: 0, category: i.category };
                        newInv[k].qty += (i.qty || 1);
                    });
                }
                setState(DB_KEYS.INVENTORY, newInv);

                alert(`✅ Procesado: $${json.total_amount} en ${newExpense.category}`);

            } catch (e) {
                alert("Error IA: " + e.message);
            } finally {
                state.isScanning = false;
                render();
            }
        }

        async function processPendingQueue() {
            alert("Procesando cola... (Simulación)");
            state.pending = [];
            setState(DB_KEYS.PENDING, []);
            render();
        }

        function toBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(file);
            });
        }

        // --- LÓGICA DE NEGOCIO ---

        function toggleAttendance(id, day) {
            const w = state.workers.find(x => x.id === id);
            if(w) {
                w.attendance[day] = !w.attendance[day];
                setState(DB_KEYS.WORKERS, state.workers);
            }

        function saveNewWorker() {
            const name = document.getElementById('newWorkerName').value;
            const role = document.getElementById('newWorkerRole').value;
            const salary = document.getElementById('newWorkerSalary').value;
            const cat = document.getElementById('newWorkerCategory').value;
            
            if(!name || !salary) return alert("Datos incompletos");

            state.workers.push({
                id: Date.now(),
                name, role, defaultCategory: cat,
                salary: parseFloat(salary) / 6, // Convertir semanal a diario aprox
                loans: [],
                attendance: { Mon: true, Tue: true, Wed: true, Thu: true, Fri: true, Sat: true }
            });
            setState(DB_KEYS.WORKERS, state.workers);
            closeModal('modalAddWorker');
        }

        function saveLoan() {
            const id = parseInt(document.getElementById('loanWorkerId').value);
            const amount = parseFloat(document.getElementById('loanAmount').value);
            
            const w = state.workers.find(x => x.id === id);
            if(w && amount) {
                w.loans.push({ id: Date.now(), amount, date: new Date().toISOString() });
                setState(DB_KEYS.WORKERS, state.workers);
                closeModal('modalLoan');
            }
        }

        function preCloseWeek(total) {
            document.getElementById('confirmPayAmount').innerText = formatMoney(total);
            openModal('modalConfirmPay');
        }

        function executePayment() {
            // Generar gastos agrupados
            const expensesByCat = {};
            let totalNet = 0;

            state.workers.forEach(w => {
                const days = Object.values(w.attendance).filter(Boolean).length;
                const gross = days * w.salary;
                const loans = w.loans.reduce((s, l) => s + l.amount, 0); // Asumimos que se cobran todos
                
                if (gross > 0) {
                    const cat = w.defaultCategory;
                    if(!expensesByCat[cat]) expensesByCat[cat] = { total: 0, items: [] };
                    expensesByCat[cat].total += gross;
                    expensesByCat[cat].items.push({
                        raw_name: w.name,
                        qty: days,
                        unit_price: w.salary,
                        total: gross,
                        loans: loans
                    });
                    totalNet += (gross - loans);
                }
            });

            // Guardar Expenses
            Object.entries(expensesByCat).forEach(([cat, data]) => {
                state.expenses.unshift({
                    id: Date.now() + Math.random(),
                    amount: data.total,
                    concept: `Raya Semanal: ${getWeekRange()}`,
                    category: cat,
                    date: new Date().toISOString(),
                    items: data.items
                });
            });
            setState(DB_KEYS.EXPENSES, state.expenses);

            // Guardar Historial
            state.history.unshift({
                id: Date.now(),
                date: getWeekRange(),
                total: totalNet
            });
            setState(DB_KEYS.HISTORY, state.history);

            // Resetear Workers
            state.workers.forEach(w => {
                w.attendance = { Mon: false, Tue: false, Wed: false, Thu: false, Fri: false, Sat: false };
                w.loans = []; // Borrar préstamos cobrados
            });
            setState(DB_KEYS.WORKERS, state.workers);

            closeModal('modalConfirmPay');
            alert("Semana cerrada correctamente.");
        }

        function saveBudget() {
            const val = document.getElementById('newBudgetAmount').value;
            if(state.editingBudgetCategory && val) {
                state.budgets[state.editingBudgetCategory] = parseFloat(val);
                setState(DB_KEYS.BUDGETS, state.budgets);
                closeModal('modalEditBudget');
                // Forzar refresco vista detalle si estamos ahí
                if(state.subView && state.subView.category === state.editingBudgetCategory) {
                    render();
                }
            }
        }

        // --- INTERFAZ PDF ---
        function exportPDF(category) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text(`Reporte: ${category}`, 10, 10);
            
            const rows = state.expenses
                .filter(e => e.category === category)
                .map(e => [formatDate(e.date), e.concept, formatMoney(e.amount)]);
                
            doc.autoTable({ head: [['Fecha', 'Concepto', 'Monto']], body: rows });
            doc.save(`Reporte_${category}.pdf`);

        function exportPayrollPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Nómina Semanal", 10, 10);
            
            const rows = state.workers.map(w => {
                const days = Object.values(w.attendance).filter(Boolean).length;
                const loans = w.loans.reduce((s,l)=>s+l.amount,0);
                const total = (days * w.salary) - loans;
                return [w.name, days, formatMoney(w.salary), formatMoney(loans), formatMoney(total)];
            });

            doc.autoTable({ head: [['Nombre', 'Días', 'Diario', 'Préstamos', 'A Pagar']], body: rows });
            doc.save('Nomina.pdf');
        }

            }
        }
        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }
        function openBudgetModal(cat, currentVal) {
            state.editingBudgetCategory = cat;
            document.getElementById('editBudgetTitle').innerText = cat;
            document.getElementById('newBudgetAmount').value = currentVal;
            openModal('modalEditBudget');
        }
        function alertDetail(concept, date, amount, itemsStr) {
            alert(`Detalle:\n${concept}\n$${amount}\n\nItems:\n` + JSON.parse(itemsStr).map(i => `- ${i.raw_name}: $${i.total}`).join('\n'));
        }
        function alertWorkerDetail(id) {
            const w = state.workers.find(x => x.id === id);
            const loans = w.loans.map(l => `$${l.amount} (${formatDate(l.date)})`).join('\n');
            alert(`Trabajador: ${w.name}\n\nPréstamos Activos:\n${loans || 'Ninguno'}`);
        }

        // --- UTILS DE DESCARGA DE CÓDIGO ---
        function downloadSource() {
            const html = document.documentElement.outerHTML;
            const blob = new Blob([html], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            a.click();
        }

        // --- INIT ---
        window.onload = () => {
            // Botón Offline
            const btnOff = document.getElementById('btnOffline');
            btnOff.onclick = () => {
                state.isOffline = !state.isOffline;
                btnOff.innerText = state.isOffline ? 'OFFLINE' : 'ONLINE';
                btnOff.className = `px-2 py-1 rounded font-bold text-xs ${state.isOffline ? 'bg-red-500 text-white' : 'bg-green-500 text-black'}`;
            };
            
            router('home');
        };

        // Exponer funciones al window para onclicks del HTML
        window.router = router;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.saveNewWorker = saveNewWorker;
        window.saveLoan = saveLoan;
        window.toggleAttendance = toggleAttendance;
        window.preCloseWeek = preCloseWeek;
        window.executePayment = executePayment;
        window.exportPayrollPDF = exportPayrollPDF;
        window.exportPDF = exportPDF;
        window.openBudgetModal = openBudgetModal;
        window.saveBudget = saveBudget;
        window.handleFileUpload = handleFileUpload;
        window.processPendingQueue = processPendingQueue;
        window.alertDetail = alertDetail;
        window.alertWorkerDetail = alertWorkerDetail;
        window.downloadSource = downloadSource;

    </script>

</body></html>
